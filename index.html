<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7e1e8"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>My Little Word Book</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7e1e8;color:#71465a;font:16px Georgia,serif}main{max-width:620px;margin:auto;padding:24px 20px 110px}h1,h2,h3{font-weight:normal;margin:10px 0}h1{font-size:35px;letter-spacing:-1px}header{text-align:center;padding:12px 0 24px}small,.eyebrow{font:11px system-ui;letter-spacing:1.5px;text-transform:uppercase;color:#98647c}p{line-height:1.55}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:#fff9f7;border-radius:14px;padding:12px}button:focus-visible,input:focus-visible{outline:2px solid #a65c7d}input,textarea,select{width:100%;padding:12px;border:1px solid #e6c3d0;border-radius:12px;background:#fffaf8;margin:6px 0 12px}textarea{min-height:100px} .paper{background:#fffaf7;border:1px solid #e8c8d3;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 5px 16px #a65c7d0a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{display:flex;align-items:center;flex-direction:column;gap:9px;padding:17px 8px;min-height:130px;border:1px solid #ead0da}.symbol{width:58px;height:58px;border-radius:18px;display:grid;place-items:center}.symbol svg{width:34px;height:34px;fill:none;stroke:white;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.tile small{letter-spacing:.3px;text-transform:none}nav{position:fixed;bottom:0;left:0;right:0;background:#fff8f8ee;display:flex;justify-content:center;padding:10px 0 max(12px,env(safe-area-inset-bottom));border-top:1px solid #e9cbd6;backdrop-filter:blur(12px)}nav button{background:none;flex:1;max-width:150px;font:12px system-ui}nav b{display:block;font:24px Georgia;margin-bottom:4px}.line{display:flex;justify-content:space-between;align-items:center;gap:8px}.entry{width:100%;text-align:left;margin:5px 0;border:1px solid #ecd3dd}.primary{background:#a65c7d;color:white}.muted{color:#98647c}.actions{display:flex;gap:8px;flex-wrap:wrap}label{display:block;font-size:14px}.hidden{display:none}hr{border:0;border-top:1px solid #ecd3dd}#notice{font:13px system-ui;color:#82516a;white-space:pre-wrap}</style><main><header><div class="eyebrow">A personal vocabulary journal</div><div style="font-size:34px;color:#b77896">୨ৎ</div><h1>My Little Word Book</h1><i class="muted">A garden of words, a growing mind.</i></header><section id="view"></section><p id="notice" role="status"></p></main><nav><button onclick="home()"><b>⌂</b>Home</button><button onclick="library()"><b>▤</b>Library</button><button onclick="edit()"><b>＋</b>Add word</button><button onclick="practice()"><b>✧</b>Practise</button><button onclick="settings()"><b>⚙</b>Settings</button></nav><script>
const seed=[{"word": "Endorse", "definition": "Support or approve of something.", "example": "I can appreciate AI without endorsing its environmental practices.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Innovation", "definition": "Introduction of new ideas, methods or technologies.", "example": "Innovation should not come at the expense of the environment.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Restraint", "definition": "Control over one's actions or impulses.", "example": "Humanity needs to exercise restraint.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Outpace", "definition": "Progress faster than something else.", "example": "Technology may outpace regulation.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Preservation", "definition": "Protection from damage or destruction.", "example": "Habitat preservation should be a priority.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Finite", "definition": "Limited in quantity.", "example": "Earth's resources are finite.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Detrimental", "definition": "Harmful or damaging.", "example": "Pollution is detrimental to ecosystems.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Inevitable", "definition": "Certain to happen; unavoidable.", "example": "Change is inevitable.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Inherent", "definition": "Naturally part of something.", "example": "There are inherent risks in new technologies.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Incentive", "definition": "Something that motivates action.", "example": "Financial incentives encourage innovation.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Discernment", "definition": "Ability to make thoughtful judgements.", "example": "Creativity requires discernment.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Merit", "definition": "Quality deserving recognition.", "example": "Judge an idea on its own merit.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Prerequisite", "definition": "Something required beforehand.", "example": "Struggle is not a prerequisite for success.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Autonomous", "definition": "Able to operate independently.", "example": "The system is not entirely autonomous.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Foundational", "definition": "Forming an essential basis.", "example": "Music theory provides foundational knowledge.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Coherent", "definition": "Logical and well connected.", "example": "Her argument was coherent.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Multidisciplinary", "definition": "Involving several fields of expertise.", "example": "AI enables multidisciplinary projects.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Redistributed", "definition": "Allocated differently.", "example": "Effort has been redistributed.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Invalidate", "definition": "Make something no longer valid.", "example": "Using tools does not invalidate creativity.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Exclusively", "definition": "Solely or entirely.", "example": "Success should not be measured exclusively by effort.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Compelling", "definition": "Convincing or captivating.", "example": "She presented a compelling argument.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Voluntarily", "definition": "By one's own choice.", "example": "They voluntarily reduced consumption.", "category": "Everyday", "own": "", "status": "New"}, {"word": "Nuanced perspective", "definition": "A viewpoint that recognises complexity.", "example": "I have a nuanced perspective on AI.", "category": "Philosophy & ideas", "own": "", "status": "New"}, {"word": "Mutually exclusive", "definition": "Unable to coexist or both be true.", "example": "Creativity and efficiency are not mutually exclusive.", "category": "Philosophy & ideas", "own": "", "status": "New"}, {"word": "Fundamental tension", "definition": "A deep conflict between opposing priorities.", "example": "There is a fundamental tension between growth and conservation.", "category": "Philosophy & ideas", "own": "", "status": "New"}, {"word": "Human ambition", "definition": "Humanity's desire to achieve and progress.", "example": "Human ambition drives discovery.", "category": "Philosophy & ideas", "own": "", "status": "New"}, {"word": "Creative execution", "definition": "Turning a creative idea into reality.", "example": "AI makes creative execution more accessible.", "category": "Philosophy & ideas", "own": "", "status": "New"}, {"word": "Technical proficiency", "definition": "A high level of practical skill.", "example": "Design requires technical proficiency.", "category": "Philosophy & ideas", "own": "", "status": "New"}, {"word": "Creative ownership", "definition": "Rights, recognition or control associated with creative work.", "example": "AI raises questions about creative ownership.", "category": "Philosophy & ideas", "own": "", "status": "New"}, {"word": "Moral burden", "definition": "A sense of ethical responsibility.", "example": "Consumers should not carry the entire moral burden.", "category": "Philosophy & ideas", "own": "", "status": "New"}, {"word": "Psychological shift", "definition": "A significant change in thinking.", "example": "Creating independently can cause a psychological shift.", "category": "Philosophy & ideas", "own": "", "status": "New"}, {"word": "Synonymous with", "definition": "Closely associated with or equivalent to.", "example": "Difficulty should not be synonymous with quality.", "category": "Philosophy & ideas", "own": "", "status": "New"}, {"word": "Exercise restraint", "definition": "Deliberately limit one's actions.", "example": "Companies should exercise restraint.", "category": "Philosophy & ideas", "own": "", "status": "New"}, {"word": "At the expense of", "definition": "By sacrificing or harming something else.", "example": "Progress should not come at the expense of nature.", "category": "Philosophy & ideas", "own": "", "status": "New"}, {"word": "In one's own interests", "definition": "Acting primarily for one's own benefit.", "example": "Corporations often act in their own interests.", "category": "Philosophy & ideas", "own": "", "status": "New"}, {"word": "Translate into", "definition": "Result in or develop into something else.", "example": "Awareness does not always translate into action.", "category": "Philosophy & ideas", "own": "", "status": "New"}, {"word": "Romanticise struggle", "definition": "Portray hardship as more admirable than it necessarily is.", "example": "Society often romanticises struggle.", "category": "Philosophy & ideas", "own": "", "status": "New"}, {"word": "Ecological preservation", "definition": "Protection of ecosystems and their natural balance.", "example": "Ecological preservation should accompany innovation.", "category": "Environment", "own": "", "status": "New"}, {"word": "Sustainability", "definition": "Meeting present needs without compromising future generations.", "example": "Sustainability should guide development.", "category": "Environment", "own": "", "status": "New"}, {"word": "Environmental footprint", "definition": "Overall environmental impact of an activity.", "example": "Companies should disclose their environmental footprint.", "category": "Environment", "own": "", "status": "New"}, {"word": "Resource consumption", "definition": "Use of energy, materials or natural resources.", "example": "Efficiency may reduce resource consumption.", "category": "Environment", "own": "", "status": "New"}, {"word": "Environmental degradation", "definition": "Deterioration of the natural environment.", "example": "Pollution accelerates environmental degradation.", "category": "Environment", "own": "", "status": "New"}, {"word": "Ecological balance", "definition": "Relatively stable relationships within an ecosystem.", "example": "Human activity can disrupt ecological balance.", "category": "Environment", "own": "", "status": "New"}, {"word": "Resource management", "definition": "Responsible organisation and use of resources.", "example": "Resource management supports sustainability.", "category": "Environment", "own": "", "status": "New"}, {"word": "Environmental consequences", "definition": "Effects of an action on the environment.", "example": "Innovation can have unforeseen environmental consequences.", "category": "Environment", "own": "", "status": "New"}, {"word": "Effort heuristic", "definition": "Tendency to value something more because more effort went into it.", "example": "The effort heuristic can influence how people judge art.", "category": "Concepts", "own": "", "status": "New"}, {"word": "Jevons paradox", "definition": "Increased efficiency can lead to increased total resource use.", "example": "More efficient AI could increase energy use through the Jevons paradox.", "category": "Concepts", "own": "", "status": "New"}, {"word": "Collective action problem", "definition": "Individual incentives conflict with a shared group interest.", "example": "Competition can create a collective action problem.", "category": "Concepts", "own": "", "status": "New"}, {"word": "Paradox", "definition": "A seemingly contradictory situation or statement.", "example": "It is a paradox that knowledge does not always lead to restraint.", "category": "Concepts", "own": "", "status": "New"}, {"word": "Seamlessly", "definition": "Smoothly, without noticeable transitions.", "example": "The widget blends seamlessly into the wallpaper.", "category": "Design & technology", "own": "", "status": "New"}, {"word": "Perpetually", "definition": "Continually or indefinitely.", "example": "Technology is perpetually evolving.", "category": "Design & technology", "own": "", "status": "New"}, {"word": "Uninterruptedly", "definition": "Without pauses or interruptions.", "example": "Music played uninterruptedly.", "category": "Design & technology", "own": "", "status": "New"}, {"word": "Indefinitely", "definition": "For an unspecified length of time.", "example": "We cannot consume finite resources indefinitely.", "category": "Design & technology", "own": "", "status": "New"}, {"word": "Truncated", "definition": "Shortened or cut off.", "example": "The song title was truncated.", "category": "Design & technology", "own": "", "status": "New"}, {"word": "Skeuomorphic", "definition": "Digital design imitating physical objects or materials.", "example": "PinkPod has a skeuomorphic design.", "category": "Design & technology", "own": "", "status": "New"}, {"word": "Cohesive", "definition": "Forming a unified whole.", "example": "The icons have a cohesive appearance.", "category": "Design & technology", "own": "", "status": "New"}, {"word": "Translucent", "definition": "Letting light through without being fully transparent.", "example": "The icons resemble translucent glass.", "category": "Design & technology", "own": "", "status": "New"}, {"word": "Iridescent", "definition": "Showing shimmering colours that change with viewing angle.", "example": "The wallpaper has an iridescent finish.", "category": "Design & technology", "own": "", "status": "New"}, {"word": "Aesthetic", "definition": "Relating to beauty or visual style.", "example": "Frutiger Aero is a nostalgic aesthetic.", "category": "Design & technology", "own": "", "status": "New"}, {"word": "Marquee scrolling", "definition": "Text moving across a display to reveal its contents.", "example": "The player uses marquee scrolling.", "category": "Design & technology", "own": "", "status": "New"}, {"word": "Articulate", "definition": "Able to express thoughts clearly and effectively.", "example": "She is articulate when explaining her ideas.", "category": "Language & usage", "own": "", "status": "New"}, {"word": "Passive vocabulary", "definition": "Words one understands but may not regularly use.", "example": "My passive vocabulary is extensive.", "category": "Language & usage", "own": "", "status": "New"}, {"word": "Active vocabulary", "definition": "Words one naturally uses in communication.", "example": "I want to expand my active vocabulary.", "category": "Language & usage", "own": "", "status": "New"}, {"word": "Glossary", "definition": "A collection of terms and their definitions.", "example": "I keep a personal glossary.", "category": "Language & usage", "own": "", "status": "New"}, {"word": "Lack thereof", "definition": "Absence of the thing just mentioned.", "example": "Confidence, or lack thereof, can affect creativity.", "category": "Language & usage", "own": "", "status": "New"}, {"word": "Owing to", "definition": "Because of.", "example": "The project was delayed owing to technical issues.", "category": "Language & usage", "own": "", "status": "New"}];const key='littlewordbook.v1';let words;try{words=JSON.parse(localStorage.getItem(key))||seed}catch{words=seed}let view=document.querySelector('#view'),notice=document.querySelector('#notice');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(words));return true}catch{notice.textContent='Storage unavailable. Export a backup before closing.';return false}}const art={ 'Everyday':'<path d="M12 21V11m0 0C4 13 3 4 8 5c0-6 8-6 8 0 5-1 4 8-4 6M12 17c-5-4-7-1-7-1 2 4 5 4 7 1m0 2c4-4 7-2 7-2-1 4-4 5-7 2"/>','Philosophy & ideas':'<path d="M12 3v17M5 6h14M3 15l4-8 4 8c-2 3-6 3-8 0zm10 0 4-8 4 8c-2 3-6 3-8 0zM8 21h8"/>','Concepts':'<path d="M12 5C8 0 3 4 4 8c-5 3-3 9 1 10 0 5 7 5 7 1V5zm0 0c4-5 9-1 8 3 5 3 3 9-1 10 0 5-7 5-7 1M4 8c4-1 6 2 5 4m11-4c-4-1-6 2-5 4M5 18c0-3 2-4 4-3m10 3c0-3-2-4-4-3"/>','Environment':'<path d="M12 22V10M12 15C3 15 2 8 3 5c7 0 9 4 9 10zm0-4c0-6 4-9 9-9 1 7-3 10-9 9"/>','Design & technology':'<path d="M12 3a9 9 0 1 0 0 18h2c2 0 2-3 0-4s-1-3 2-3h3c4 0 2-11-7-11z"/><circle cx="7" cy="10" r="1"/><circle cx="11" cy="6" r="1"/><circle cx="16" cy="8" r="1"/>','Language & usage':'<path d="M4 20c5-8 10-12 17-17 0 8-5 15-12 14M4 20l-1 2M9 15l6-1"/>','Favourites':'<path d="M12 21 3 12C-2 5 7 0 12 7c5-7 14-2 9 5z"/>'};const names={'Everyday':'Everyday eloquence','Philosophy & ideas':'Philosophy & debate','Concepts':'Psychology & concepts','Environment':'Nature & society','Design & technology':'Creative expression','Language & usage':'Language & expression'};const colors=['#e7b6c9','#d8bdd5','#eec6d0','#b9cbb4','#d8b9d3','#d9c2b6'];function cats(){return [...new Set(words.map(w=>w.category))]}function symbol(c,i){return `<span class="symbol" style="background:${colors[i%6]}"><svg viewBox="0 0 24 24">${art[c]||art.Favourites}</svg></span>`}function show(h){view.innerHTML=h;notice.textContent='';window.scrollTo(0,0)}function home(){let w=words[Math.floor(Date.now()/86400000)%Math.max(1,words.length)];show(`<input placeholder="Find a little word…" aria-label="Search words" oninput="search(this.value)"><div id="results"></div>${w?`<article class="paper"><div class="eyebrow">Today's little word</div><h2>${esc(w.word)}</h2><p>${esc(w.definition)}</p><hr><i>${esc(w.example)}</i></article>`:''}<h2>My collections</h2><div class="grid">${[...cats(),'Favourites'].map((c,i)=>`<button class="tile" data-cat="${esc(c)}" onclick="library(this.dataset.cat)">${symbol(c,i)}${esc(names[c]||c)}<small>${words.filter(w=>c==='Favourites'?w.fav:w.category===c).length} words</small></button>`).join('')}</div>`)}function rows(a){return a.map(w=>`<button class="entry" onclick="detail(${words.indexOf(w)})"><h3>${esc(w.word)}</h3><small>${esc(w.status||'New')}</small></button>`).join('')||'<p>No words found.</p>'}function search(q){document.querySelector('#results').innerHTML=q?rows(words.filter(w=>(w.word+' '+w.definition).toLowerCase().includes(q.toLowerCase()))):''}function library(c){show(`<h2>${esc(names[c]||c||'All my words')}</h2><input placeholder="Search…" oninput="filterList(this.value)"><div id="list">${rows(words.filter(w=>!c||(c==='Favourites'?w.fav:w.category===c)))}</div>`);window.currentCat=c}function filterList(q){document.querySelector('#list').innerHTML=rows(words.filter(w=>(!window.currentCat||(window.currentCat==='Favourites'?w.fav:w.category===window.currentCat))&&(w.word+' '+w.definition).toLowerCase().includes(q.toLowerCase())))}function detail(i){let w=words[i];show(`<button onclick="library()">‹ Library</button><article class="paper"><div class="line"><small>${esc(w.category)}</small><button onclick="words[${i}].fav=!words[${i}].fav;save();detail(${i})">${w.fav?'♥':'♡'}</button></div><h1>${esc(w.word)}</h1><p>${esc(w.definition)}</p><hr><i>${esc(w.example)}</i><p>${esc(w.synonyms||'')}</p><label>My own sentence<textarea onchange="words[${i}].own=this.value;save()">${esc(w.own)}</textarea></label><label>Practice status<select onchange="words[${i}].status=this.value;save()">${['New','Practising','Confident'].map(x=>`<option ${w.status===x?'selected':''}>${x}</option>`).join('')}</select></label><button onclick="edit(${i})">Edit entry</button></article>`)}function edit(i=-1){let w=words[i]||{};show(`<h2>${i<0?'Add a little word':'Edit entry'}</h2><form class="paper" onsubmit="submitWord(event,${i})">${['word','definition','example','category','synonyms'].map(k=>`<label>${k[0].toUpperCase()+k.slice(1)}<input name="${k}" value="${esc(w[k])}" ${k==='word'||k==='definition'?'required':''} ${k==='category'?'list="categories"':''}></label>`).join('')}<datalist id="categories">${cats().map(c=>`<option value="${esc(c)}">`).join('')}</datalist><button class="primary">Save word</button></form>${i>=0?`<button onclick="if(confirm('Delete this word?')){words.splice(${i},1);save();library()}">Delete word</button>`:''}<button onclick="importPage()">Import vocabulary</button>`)}function submitWord(e,i){e.preventDefault();let w=Object.fromEntries(new FormData(e.target));w.word=w.word.trim();w.category=w.category.trim()||'Everyday';if(!w.word)return;if(words.some((x,j)=>j!==i&&x.word.toLowerCase()===w.word.toLowerCase())){notice.textContent='That word is already in your journal.';return}if(i<0){words.push({...w,status:'New',own:''});i=words.length-1}else words[i]={...words[i],...w};save();detail(i)}function importPage(){show(`<h2>Import words</h2><p>Paste a JSON vocabulary entry or array of entries.</p><textarea id="payload" placeholder='[{"word":"Eloquence","definition":"…","example":"…","category":"Everyday"}]'></textarea><button class="primary" onclick="importWords(document.querySelector('#payload').value)">Import</button>`)}function importWords(raw){try{let a=JSON.parse(raw);if(!Array.isArray(a))a=[a];let n=0;for(let w of a){if(!w||typeof w.word!=='string'||typeof w.definition!=='string'||!w.word.trim())continue;if(words.some(x=>x.word.toLowerCase()===w.word.trim().toLowerCase()))continue;words.push({word:w.word.trim(),definition:w.definition,example:String(w.example||''),category:String(w.category||'Everyday'),synonyms:String(w.synonyms||''),own:String(w.own||''),status:['New','Practising','Confident'].includes(w.status)?w.status:'New',fav:!!w.fav});n++}save();home();notice.textContent=`Imported ${n} new words. Duplicates skipped.`}catch{notice.textContent='Invalid JSON. Please check the import format.'}}function practice(){if(!words.length)return home();let pool=words.filter(w=>w.status!=='Confident');if(!pool.length)pool=words;let w=pool[Math.floor(Math.random()*pool.length)],i=words.indexOf(w);show(`<h2>Little moments of learning</h2><article class="paper" style="text-align:center"><small>Recall the definition</small><h1>${esc(w.word)}</h1><button onclick="this.hidden=true;document.querySelector('#answer').hidden=false">Reveal definition</button><div id="answer" hidden><p>${esc(w.definition)}</p><i>${esc(w.example)}</i><p><button onclick="words[${i}].status='Practising';save();practice()">Still learning</button> <button class="primary" onclick="words[${i}].status='Confident';save();practice()">I know it</button></p></div></article>`)}function settings(){show(`<h2>My journal settings</h2><article class="paper"><p>${words.length} words in your journal.</p><button onclick="backup()">Export JSON backup</button><p><label>Import backup (merges new words)<input type="file" accept=".json" onchange="this.files[0]?.text().then(importWords)"></label></p><button onclick="importPage()">Paste vocabulary JSON</button></article>`)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(words,null,2)],{type:'application/json'}));a.download='my-word-book.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}home();let incoming=new URLSearchParams(location.search).get('import');if(incoming){importPage();document.querySelector('#payload').value=incoming;history.replaceState(null,'',location.pathname)}if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});</script></html>
