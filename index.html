d}#notice{font:13px system-ui;color:#82516a;white-space:pre-wrap}.game{display:flex;align-items:center;gap:14px;padding:14px}.gameicon{background:#e7b6c9;border-radius:14px;width:48px;height:48px;display:grid;place-items:center;flex:none}.gameicon svg,nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.gameicon svg{color:white}.game small{letter-spacing:0;text-transform:none}.chosen{background:#edc4d5;border-color:#a65c7d}button:disabled{opacity:.65;cursor:default}.gardenstats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}.gardenstats strong,.gardenstats small{display:block}.plant{width:48px;height:58px}.garden{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#f5f5e9}.garden button{background:transparent;padding:6px;min-width:0}.garden span{display:block;font-size:12px;overflow-wrap:anywhere}nav svg{display:block;margin:0 auto 5px} .flipcard{display:block;width:100%;padding:0;background:transparent;perspective:1000px;margin:16px 0}.flipinner{display:grid;transform-style:preserve-3d;transition:transform .55s ease}.flipcard.flipped .flipinner{transform:rotateY(180deg)}.flipface{grid-area:1/1;min-height:250px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;background:#fffaf7;border:1px solid #e8c8d3;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow-wrap:anywhere}.flipface h3{font-size:28px}.flipback{transform:rotateY(180deg)}.rating{display:flex;align-items:center;gap:12px}.rating .plant{flex:none}.rating small{display:block;text-transform:none;letter-spacing:0;margin-top:5px}.ratingpanel[hidden]{display:none}@media(prefers-reduced-motion:reduce){.flipinner{transition:none}} </style><main><header><div class="eyebrow">A personal vocabulary journal</div><div style="font-size:34px;color:#b77896">୨ৎ</div><h1>My Little Word Book</h1><i class="muted">A garden of words, a growing mind.</i></header><section id="view"></section><p id="notice" role="status"></p></main><nav><button onclick="home()"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-7H9v7H3z"/></svg>Home</button><button onclick="library()"><svg viewBox="0 0 24 24"><path d="M4 3h16v18H4zM8 7h8M8 11h8M8 15h8"/></svg>Library</button><button onclick="edit()"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>Add word</button><button onclick="practice()"><svg viewBox="0 0 24 24"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></svg>Practise</button><button onclick="settings()"><svg viewBox="0 0 24 24"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M6 6l2 2m8 8 2 2M6 18l2-2m8-8 2-2 M12 7a5 5 0 1 0 0 10 5 5 0 1 0 0-10"/></svg>Settings</button></nav><script>

"word": "Articulate", "definition": "Able to express thoughts clearly and effectively.", "example": "She is articulate when explaining her ideas.", "category": "Language & usage", "own": "", "status": "New"}, {"word": "Passive vocabulary", "definition": "Words one understands but may not regularly use.", "example": "My passive vocabulary is extensive.", "category": "Language & usage", "own": "", "status": "New"}, {"word": "Active vocabulary", "definition": "Words one naturally uses in communication.", "example": "I want to expand my active vocabulary.", "category": "Language & usage", "own": "", "status": "New"}, {"word": "Glossary", "definition": "A collection of terms and their definitions.", "example": "I keep a personal glossary.", "category": "Language & usage", "own": "", "status": "New"}, {"word": "Lack thereof", "definition": "Absence of the thing just mentioned.", "example": "Confidence, or lack thereof, can affect creativity.", "category": "Language & usage", "own": "", "status": "New"}, {"word": "Owing to", "definition": "Because of.", "example": "The project was delayed owing to technical issues.", "category": "Language & usage", "own": "", "status": "New"}];const key='littlewordbook.v1';let words;try{words=JSON.parse(localStorage.getItem(key))||seed}catch{words=seed}let view=document.querySelector('#view'),notice=document.querySelector('#notice');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(words));return true}catch{notice.textContent='Storage unavailable. Export a backup before closing.';return false}}const art={ 'Everyday':'<path d="M12 21V11m0 0C4 13 3 4 8 5c0-6 8-6 8 0 5-1 4 8-4 6M12 17c-5-4-7-1-7-1 2 4 5 4 7 1m0 2c4-4 7-2 7-2-1 4-4 5-7 2"/>','Philosophy & ideas':'<path d="M12 3v17M5 6h14M3 15l4-8 4 8c-2 3-6 3-8 0zm10 0 4-8 4 8c-2 3-6 3-8 0zM8 21h8"/>','Concepts':'<path d="M12 5C8 0 3 4 4 8c-5 3-3 9 1 10 0 5 7 5 7 1V5zm0 ll></button>`).join('')||'<p>No words found.</p>'}function search(q){document.querySelector('#results').innerHTML=q?rows(words.filter(w=>(w.word+' '+w.definition).toLowerCase().includes(q.toLowerCase()))):''}function library(c){show(`<h2>${esc(names[c]||c||'All my words')}</h2><input placeholder="Search…" oninput="filterList(this.value)"><div id="list">${rows(words.filter(w=>!c||(c==='Favourites'?w.fav:w.category===c)))}</div>`);window.currentCat=c}function filterList(q){document.querySelector('#list').innerHTML=rows(words.filter(w=>(!window.currentCat||(window.currentCat==='Favourites'?w.fav:w.category===window.currentCat))&&(w.word+' '+w.definition).toLowerCase().includes(q.toLowerCase())))}function detail(i){let w=words[i];show(`<button onclick="library()">‹ Library</button><article class="paper"><div class="line"><small>${esc(w.category)}</small><button onclick="words[${i}].fav=!words[${i}].fav;save();detail(${i})">${w.fav?'♥':'♡'}</button></div><h1>${esc(w.word)}</h1><p>${esc(w.definition)}</p><hr><i>${esc(w.example)}</i><p>${esc(w.synonyms||'')}</p><label>My own sentence<textarea onchange="words[${i}].own=this.value;save()">${esc(w.own)}</textarea></label><label>Practice status<select onchange="words[${i}].status=this.value;save()">${['New','Practising','Confident'].map(x=>`<option ${w.status===x?'selected':''}>${x}</option>`).join('')}</select></label><button onclick="edit(${i})">Edit entry</button></article>`)}function edit(i=-1){let w=words[i]||{};show(`<h2>${i<0?'Add a little word':'Edit entry'}</h2><form class="paper" onsubmit="submitWord(event,${i})">${['word','definition','example','category','synonyms'].map(k=>`<label>${k[0].toUpperCase()+k.slice(1)}<input name="${k}" value="${esc(w[k])}" ${k==='word'||k==='definition'?'required':''} ${k==='category'?'list="categories"':''}></label>`).join('')}<datalist id="categories">${cats().map(c=>`<option value="${esc(c)}">`).join('')}</datalist><button class="primary">Save word</button></form>${i>=0?`<button oncl Choose a precise expression','✧'],['kind','Kindred Words','Find synonyms or antonyms','♡'],['daily','The Daily Challenge','Five mixed questions','☆']];
const relations={Endorse:['support','oppose'],Innovation:['invention','stagnation'],Restraint:['self-control','indulgence'],Finite:['limited','infinite'],Detrimental:['harmful','beneficial'],Inevitable:['unavoidable','avoidable'],Autonomous:['independent','dependent'],Coherent:['logical','incoherent'],Compelling:['convincing','unconvincing'],Cohesive:['unified','fragmented'],Truncated:['shortened','extended'],Voluntarily:['willingly','involuntarily'],Exclusively:['solely','inclusively'],Preservation:['protection','destruction'],Articulate:['expressive','inarticulate'],Translucent:['semi-transparent','opaque'],Perpetually:['continually','occasionally'],Inherent:['intrinsic','extrinsic'],Discernment:['judgement','indiscrimination']};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const stage=w=>Math.min(3,Math.max(0,w.growth??(w.status==='Confident'?3:w.status==='Practising'?1:0)));const stages=['Seed','Sprout','Bud','Bloom'];function record(w,ok){w.growth=Math.max(0,Math.min(3,stage(w)+(ok?1:0)));w.status=w.growth===3?'Confident':w.growth?'Practising':'New';w.reviews=(w.reviews||0)+1;w.due=Date.now()+(ok?[0,1,3,7][w.growth]*86400000:0);save()}
function practice(){show(`<h2>A little time to learn ♡</h2><p class="muted">Choose your little moment of practice.</p><button class="entry" onclick="garden()"><h3>My Little Garden</h3><small>${words.filter(w=>stage(w)===3).length} blooms · See your progress</small></button>${games.map(([id,t,d,ic])=>`<button class="game entry" onclick="startGame('${id}')"><span class="gameicon">${gameIcon(id)}</span><span><h3>${t}</h3><small>${d}</small></span></button>`).join('')}`)}
function gameIcon(id){let paths={flash:'<rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8 9h8M8 13h6"/>',match:'<path d="M3 8h6l3 3 3-3h6M3 16h6l3-3 3 3h6"/>',gap:'<path d="M4 20h16M5 15 16 4l4 4-11 11H5z"/>',scramble:art.Everyday,better:art['Language & usage'],kind:art.Favourites,daily:'<path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>'};return `<svg viewBox="0 0 24 24">${paths[id]||art.Environment}</svg>`}
function plant(n){return `<svg viewBox="0 0 48 58" class="plant"><path d="M5 51Q24 45 43 51" stroke="#c9b3a1" fill="none" stroke-width="2"/>${n===0?'<ellipse cx="24" cy="47" rx="5" ry="3" fill="#b49a83"/>':`<path d="M24 49V${n===1?27:18}" stroke="#8ba27e" stroke-width="2.5"/><ellipse cx="18" cy="36" rx="8" ry="4" fill="#a8bd9d" transform="rotate(35 18 36)"/><ellipse cx="30" cy="30" rx="8" ry="4" fill="#a8bd9d" transform="rotate(-35 30 30)"/>${n===2?'<ellipse cx="24" cy="17" rx="6" ry="9" fill="#dfa7bd"/>':n===3?'<g fill="#e8b4c9"><circle cx="24" cy="9" r="7"/><circle cx="33" cy="16" r="7"/><circle cx="29" cy="25" r="7"/><circle cx="19" cy="25" r="7"/><circle cx="15" cy="16" r="7"/></g><circle cx="24" cy="17" r="5" fill="#e4ce96"/>':''}`}</svg>`}
function garden(){show(`<button onclick="practice()">‹ Practise</button><h2>My Little Garden</h2><p class="muted">Every word is a little seed of knowledge.</p><div class="gardenstats">${stages.map((t,i)=>`<div>${plant(i)}<strong>${words.filter(w=>stage(w)===i).length}</strong><small>${t}s</small></div>`).join('')}</div><article class="paper garden">${words.map((w,i)=>`<button onclick="detail(${i})" title="${esc(w.word)}">${plant(stage(w))}<span>${esc(w.word)}</span></button>`).join('')}</article>`)}
let session,question;function startGame(mode){if(mode==='flash'){flashSetup();return}session={mode,n:0,score:0,seen:[]};nextGame()}
function gapFor(w){let i=w.example?.toLowerCase().indexOf(w.word.toLowerCase())??-1;return i<0?null:w.example.slice(0,i)+'_____ '+w.example.slice(i+w.word.length).trimStart()}
function poolFor(mode){return words.filter(w=>mode==='gap'?gapFor(w):mode==='scramble'?/^[a-z]{4,}$/i.test(w.word):mode==='kind'?relations[w.word]:true)}
function nextGame(){if(session.n>=5){show(`<article class="paper"><h2>Beautifully done ♡</h2><p>${session.score} of ${session.n} correct.</p><button class="primary" onclick="practice()">More practice</button> <button onclick="garden()">Visit garden</button></article>`);return}let mode=session.mode==='daily'?['flash','match','gap','better','kind'][session.n]:session.mode;if(mode==='flash'){dailyFlash();return}let pool=poolFor(mode);if(!pool.length){show('<p>Not enough suitable words for this game yet.</p><button onclick="practice()">Back</button>');return}let fresh=pool.filter(w=>!session.seen.includes(w));if(fresh.length)pool=fresh;let due=pool.filter(w=>!w.due||w.due<=Date.now());let w=shuffle(due.length?due:pool)[0];session.seen.push(w);let others=shuffle(words.filter(x=>x!==w&&x.definition!==w.definition)).slice(0,3);let opts=shuffle([w,...others]).map(x=>({label:mode==='match'?x.definition:x.word,w:x}));let prompt=w.definition; if(mode==='gap')prompt=gapFor(w);if(mode==='match')prompt=w.word;if(mode==='better')prompt='Find the precise expression for: '+w.definition;if(mode==='kind'){let antonym=session.n%2===1;let pair=relations[w.word];prompt=`Choose ${antonym?'an antonym':'a synonym'} for ${w.word}`;let correct=pair[antonym?1:0];opts=shuffle([{label:correct,w,correct:true},...shuffle(Object.entries(relations).filter(([k,v])=>k!==w.word&&!v.includes(correct)&&!v.includes(pair[0])&&!v.includes(pair[1]))).slice(0,3).map(([k,v])=>({label:v[0],w:words.find(x=>x.word===k),correct:false}))]);opts=opts.filter((o,i)=>opts.findIndex(x=>x.label===o.label)===i)}question={mode,w,opts,selected:-1};let title=games.find(g=>g[0]===mode)[1];let scrambled=shuffle(w.word.split('')).join('');if(scrambled===w.word)scrambled=w.word.slice(1)+w.word[0];show(`<button onclick="practice()">‹ Practise</button><h2>${title}</h2><small>${session.n+1} of 5</small><article class="paper"><h3>${esc(mode==='flash'?w.word:mode==='scramble'?scrambled:prompt)}</h3>${mode==='flash'?'<button onclick="this.hidden=true;document.querySelector(\'#reveal\').hidden=false">Reveal definition</button><div id="reveal" hidden><p>'+esc(w.definition)+'</p><i>'+esc(w.example)+'</i><p><button onclick="finish(false)">Still learning</button> <button class="primary" onclick="finish(true)">I know it</button></p></div>':mode==='scramble'?`<p>${esc(w.definition)}</p><input id="guess" placeholder="Your answer" autocomplete="off"><button class="primary" onclick="confirmGame()">Confirm answer</button>`:opts.map((o,i)=>`<button class="entry choice" onclick="choose(${i})">${esc(o.label)}</button>`).join('')+'<button id="confirm" class="primary" disabled onclick="confirmGame()">Confirm answer</button>'}</article><div id="feedback"></div>`)}
function choose(i){question.selected=i;document.querySelectorAll('.choice').forEach((b,j)=>b.classList.toggle('chosen',i===j));document.querySelector('#confirm').disabled=false}function confirmGame(){let q=question;if(q.mode==='scramble'){let guess=document.querySelector('#guess').value.trim();if(!guess)return;finish(guess.toLowerCase()===q.w.word.toLowerCase());return}if(q.selected<0)return;let o=q.opts[q.selected];finish(q.mode==='kind'?o.correct:o.w===q.w,o)}function finish(ok,o){let q=question;record(q.w,ok);session.n++;if(ok)session.score++;view.querySelectorAll('article button,article input').forEach(b=>b.disabled=true);document.querySelector('#feedback').innerHTML=`<article class="paper"><h3>${ok?'Beautifully done ♡':'A little more to learn ♡'}</h3>${o&&q.mode==='better'?`<small>Your selected word</small><h3>${esc(o.w.word)}</h3><p>${esc(o.w.definition)}</p><hr>`:''}<small>${ok?'Meaning':'Correct answer'}</small><h3>${esc(q.mode==='kind'?q.opts.find(x=>x.correct).label:q.w.word)}</h3><p>${esc(q.w.definition)}</p><i>${esc(q.w.example)}</i></article><button class="primary" onclick="nextGame()">${session.n===5?'See results':'Next word'}</button>`;document.querySelector('#feedback').scrollIntoView({behavior:'smooth',block:'nearest'})}

let flashSession,flashCurrent,flashRated=false;
function flashSetup(){let cats=[...new Set(words.map(w=>w.category))];show(`<button onclick="practice()">‹ Practise</button><h2>Little Flashcards ♡</h2><article class="paper"><p>Recall the answer before turning your card.</p><label>Collection<select id="fcCollection"><option value="all">Entire library</option><option value="fav">Favourites</option>${cats.map((c,i)=>`<option value="${i}">${esc(names[c]||c)}</option>`).join('')}</select></label><label>Card direction<select id="fcDirection"><option value="forward">Word → definition</option><option value="reverse">Definition → word</option><option value="mixed">A little of both</option></select></label><label>Session length<select id="fcLength"><option>5</option><option selected>10</option><option>20</option></select></label><button class="primary" onclick="beginFlash()">Begin practice</button></article>`)}
function beginFlash(){let c=document.querySelector('#fcCollection').value, cats=[...new Set(words.map(w=>w.category))], pool=words.filter(w=>c==='all'||(c==='fav'?w.fav:w.category===cats[Number(c)]));if(!pool.length){notice.textContent='No words in this collection yet.';return}let now=Date.now(),ordered=shuffle(pool).sort((a,b)=>Number((a.due||0)>now)-Number((b.due||0)>now));flashSession={queue:ordered.slice(0,Number(document.querySelector('#fcLength').value)).map(w=>({w,retry:false})),direction:document.querySelector('#fcDirection').value,n:0,ratings:[0,0,0],daily:false};flashNext()}
function dailyFlash(){let w=shuffle(words.filter(w=>!w.due||w.due<=Date.now()))[0]||shuffle(words)[0];if(!w){practice();return}flashSession={queue:[{w,retry:true}],direction:'forward',n:0,ratings:[0,0,0],daily:true};flashNext()}
function flashNext(){let f=flashSession;if(!f.queue.length){show(`<article class="paper"><h2>Beautifully done ♡</h2><p>${f.n} cards reviewed.</p><p>${f.ratings[0]} still learning · ${f.ratings[1]} almost remembered · ${f.ratings[2]} remembered perfectly</p><button class="primary" onclick="flashSetup()">Practise again</button> <button onclick="garden()">Visit garden</button></article>`);return}flashCurrent=f.queue.shift();flashRated=false;let w=flashCurrent.w,reverse=f.direction==='reverse'||(f.direction==='mixed'&&Math.random()<.5);show(`<button onclick="practice()">‹ Practise</button><h2>Little Flashcards</h2><small>Card ${f.n+1} · ${f.queue.length+1} remaining</small><button class="flipcard" id="flipCard" aria-label="Reveal answer" aria-pressed="false" onclick="flipFlash()"><span class="flipinner"><span class="flipface" id="fcFront"><small>${reverse?'Can you recall the word?':'Can you recall the definition?'}</small><h3>${esc(reverse?w.definition:w.word)}</h3><small>Tap to flip ↻</small></span><span class="flipface flipback" id="fcBack" aria-hidden="true"><h3>${esc(w.word)}</h3><span>${esc(w.definition)}</span><i>${esc(w.example||'')}</i><small>Tap to flip back ↻</small></span></span></button><div id="ratingPanel" class="ratingpanel" hidden><h3>How well did you remember?</h3>${['Still learning','Almost remembered','Remembered perfectly'].map((t,i)=>`<button class="entry rating" onclick="rateFlash(${i})">${plant(i+1)}<span>${t}<small>${['Review again soon','Review tomorrow','Grow your flower'][i]}</small></span></button>`).join('')}</div>`)}
function flipFlash(){let b=document.querySelector('#flipCard'),on=b.classList.toggle('flipped');b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',on?'Show prompt':'Reveal answer');document.querySelector('#fcFront').setAttribute('aria-hidden',String(on));document.querySelector('#fcBack').setAttribute('aria-hidden',String(!on));document.querySelector('#ratingPanel').hidden=!on}
function rateFlash(r){if(flashRated)return;flashRated=true;let f=flashSession,w=flashCurrent.w;w.growth=Math.min(3,stage(w)+(r===2?1:0));w.status=w.growth===3?'Confident':w.growth?'Practising':'New';w.reviews=(w.reviews||0)+1;w.flashInterval=r===0?0:r===1?1:Math.min(60,Math.max(2,(w.flashInterval||1)*2));w.due=Date.now()+w.flashInterval*86400000;save();f.n++;f.ratings[r]++;if(r===0&&!flashCurrent.retry&&!f.daily)f.queue.push({w,retry:true});if(f.daily){session.n++;if(r===2)session.score++;nextGame()}else flashNext()}

function settings(){show(`<h2>My journal settings</h2><article class="paper"><p>${words.length} words in your journal.</p><button onclick="backup()">Export JSON backup</button><p><label>Import backup (merges new words)<input type="file" accept=".json" onchange="this.files[0]?.text().then(importWords)"></label></p><button onclick="importPage()">Paste vocabulary JSON</button></article>`)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(words,null,2)],{type:'application/json'}));a.download='my-word-book.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}home();let incoming=new URLSearchParams(location.search).get('import');if(incoming){importPage();document.querySelector('#payload').value=incoming;history.replaceState(null,'',location.pathname)}if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});</script></html>
